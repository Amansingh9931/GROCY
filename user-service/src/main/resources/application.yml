server:
  port: 8001
spring:
  application:
    name: user-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}/grocecart_users
      auto-index-creation: true
jwt:
  secret: ${JWT_SECRET}
  expires: ${JWT_EXPIRES:7d}
internal:
  key: ${INTERNAL_KEY:change-me-internal-key}
google:
  client-id: ${GOOGLE_CLIENT_ID:}
admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}
