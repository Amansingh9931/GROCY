server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        # internal service-to-service header must never be accepted from the outside
        - RemoveRequestHeader=X-Internal-Key
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ORIGIN:http://localhost:5173}
            allowed-methods: GET,POST,PUT,DELETE,OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      routes:
        # ---- user-service ----
        - id: user-auth
          uri: ${USER_SERVICE_URL:http://localhost:8001}
          predicates: [ "Path=/api/user/**" ]
        - id: admin-users
          uri: ${USER_SERVICE_URL:http://localhost:8001}
          predicates: [ "Path=/api/admin/stats,/api/admin/users/**,/api/admin/user/**" ]
        # ---- product-service ----
        - id: products-public
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8002}
          predicates: [ "Path=/api/products/**" ]
        - id: products-admin
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8002}
          predicates: [ "Path=/api/admin/products/**,/api/admin/products" ]
        # ---- cart-service ----
        - id: cart
          uri: ${CART_SERVICE_URL:http://localhost:8003}
          predicates: [ "Path=/api/cart/**" ]
        # ---- address-service ----
        - id: address
          uri: ${ADDRESS_SERVICE_URL:http://localhost:8004}
          predicates: [ "Path=/api/address/**" ]
        # ---- order-service ----
        - id: orders-customer
          uri: ${ORDER_SERVICE_URL:http://localhost:8005}
          predicates: [ "Path=/api/order/**" ]
        - id: orders-admin
          uri: ${ORDER_SERVICE_URL:http://localhost:8005}
          predicates: [ "Path=/api/admin/orders/**,/api/admin/orders,/api/admin/debug/**" ]
        # ---- delivery-service ----
        - id: delivery
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8006}
          predicates: [ "Path=/api/delivery/**" ]
        # ---- tracking-service (Socket.IO over WebSocket) ----
        - id: tracking
          uri: ${TRACKING_WS_URL:ws://localhost:9092}
          predicates: [ "Path=/socket.io/**" ]
